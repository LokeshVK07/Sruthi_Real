name: Background Refresh Telugu

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Run a full catalog refresh instead of incremental mode
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: sruthi-background-refresh-telugu
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  refresh-local-catalog:
    name: Refresh Local Telugu Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_MANIFEST: cloudflare/.generated/release-manifest-telugu.json
      RELEASE_DUCKDB: cloudflare/.generated/release-check-telugu.duckdb
      TELUGU_DATA_DIR: data/telugu
      TELUGU_MEDIA_DIR: media/telugu
      TELUGU_CACHE_DIR: .cache/audio-telugu
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install workflow dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb requests beautifulsoup4 cloudscraper

      - name: Validate local refresh workflow files
        run: |
          set -euo pipefail

          required_files=(
            ".github/workflows/background-refresh-telugu.yml"
            "cloudflare/scripts/prepare_release.py"
            "cloudflare/data/release-baseline-telugu.json"
            "tools/masstelugu_refresh.py"
            "server.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -e "$file" ]]; then
              echo "::error::Required workflow file is missing: $file"
              exit 1
            fi
          done

      - name: Resolve run mode
        run: |
          set -euo pipefail
          full_refresh="true"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.full_refresh }}" != "true" ]]; then
            full_refresh="false"
          fi
          echo "SRUTHI_FULL_REFRESH=${full_refresh}" >> "$GITHUB_ENV"

      - name: Refresh catalog from MassTelugu
        run: |
          set -euo pipefail
          mkdir -p cloudflare/.generated "${TELUGU_DATA_DIR}" "${TELUGU_MEDIA_DIR}" "${TELUGU_CACHE_DIR}"
          workers="$(python - <<'PY'
          import os
          print(max(4, os.cpu_count() or 4))
          PY
          )"
          batch_size="$(( workers * 4 ))"
          page_delay="1"
          album_delay="1"
          retry_count="5"
          retry_base_delay="8"
          stop_after_known_pages="4"
          movie_index_stop_after_known_pages="45"
          echo "Refresh configuration"
          echo "  mode = LOCAL CATALOG REFRESH"
          echo "  workers = ${workers}"
          echo "  batch_size = ${batch_size}"
          echo "  listing delay (s) = ${page_delay}"
          echo "  detail delay (s) = ${album_delay}"
          echo "  retry count = ${retry_count}"
          echo "  retry base delay (s) = ${retry_base_delay}"
          echo "  stop after known pages = ${stop_after_known_pages}"
          echo "  movie index stop after known pages = ${movie_index_stop_after_known_pages}"

          args=(
            --workers "${workers}"
            --batch-size "${batch_size}"
            --page-delay "${page_delay}"
            --album-delay "${album_delay}"
            --retry-count "${retry_count}"
            --retry-base-delay "${retry_base_delay}"
            --stop-after-known-pages "${stop_after_known_pages}"
            --movie-index-stop-after-known-pages "${movie_index_stop_after_known_pages}"
          )
          if [[ "${SRUTHI_FULL_REFRESH}" == "true" ]]; then
            args+=(--full)
          fi

          python tools/masstelugu_refresh.py "${args[@]}"

      - name: Validate refreshed local catalog files
        run: |
          set -euo pipefail
          if [[ ! -f "${TELUGU_DATA_DIR}/sruthi.db" ]]; then
            echo "::error::Expected ${TELUGU_DATA_DIR}/sruthi.db to exist after refresh."
            exit 1
          fi
          if [[ ! -s "${TELUGU_DATA_DIR}/sruthi.db" ]]; then
            echo "::error::${TELUGU_DATA_DIR}/sruthi.db exists but is empty."
            exit 1
          fi
          python - <<'PY'
          import os
          import sqlite3
          db_path = os.path.join(os.environ["TELUGU_DATA_DIR"], "sruthi.db")
          conn = sqlite3.connect(db_path)
          cur = conn.cursor()
          album_count = cur.execute("SELECT COUNT(*) FROM albums").fetchone()[0]
          song_count = cur.execute("SELECT COUNT(*) FROM songs").fetchone()[0]
          if album_count <= 0 or song_count <= 0:
              raise SystemExit(f"Local Telugu catalog validation failed: albums={album_count}, songs={song_count}")
          print({"albumCount": album_count, "songCount": song_count})
          PY

      - name: Validate catalog and build release seed
        run: |
          set -euo pipefail
          python cloudflare/scripts/prepare_release.py \
            --db "${TELUGU_DATA_DIR}/sruthi.db" \
            --seed cloudflare/data/seed-telugu.sql \
            --baseline cloudflare/data/release-baseline-telugu.json \
            --manifest "${RELEASE_MANIFEST}" \
            --duckdb-path "${RELEASE_DUCKDB}"

          if [[ ! -f cloudflare/data/seed-telugu.sql ]]; then
            echo "::error::Release seed was not generated."
            exit 1
          fi
          if [[ ! -s cloudflare/data/seed-telugu.sql ]]; then
            echo "::error::Release seed was generated but is empty."
            exit 1
          fi
          if [[ ! -f "${RELEASE_MANIFEST}" ]]; then
            echo "::error::Release manifest was not generated."
            exit 1
          fi

      - name: Upload local refresh artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sruthi-local-refresh-telugu
          if-no-files-found: error
          path: |
            ${{ env.TELUGU_DATA_DIR }}/sruthi.db
            cloudflare/data/seed-telugu.sql
            ${{ env.RELEASE_MANIFEST }}
            ${{ env.RELEASE_DUCKDB }}
